<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TF2‑Style Roblox Game Randomizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Arial Black",Arial,sans-serif;}
body{
  width:100vw;height:100vh;overflow:hidden;
  color:#e8e2d5;
  background:rgba(30,28,25,0.85);
}
#root{position:relative;width:100%;height:100%;}

/* ========== 主菜单UI ========== */
.logo{
  position:absolute;top:18px;left:18px;z-index:5;
}
.logo h1{
  font-size:58px;color:#fff;
  text-shadow:3px 3px 0 #b86016;
}
.left-menu{
  position:absolute;left:18px;top:140px;width:370px;
  display:flex;flex-direction:column;gap:18px;z-index:5;
}
.menu-panel{
  background:rgba(24,22,20,0.82);
  border:2px solid #504942;border-radius:4px;padding:12px;
}
.panel-title{
  font-size:19px;color:#e6c89c;margin-bottom:10px;text-transform:uppercase;
}
.btn-list{display:flex;flex-direction:column;gap:8px;}
.tf2-btn{
  width:100%;background:#c9bc9f;color:#222;
  border:2px solid #746b5b;border-radius:3px;padding:10px 14px;
  font-size:16px;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:0.12s;
}
.tf2-btn:hover{background:#e2d7bf;border-color:#b86016;}

/* ========== Quickplay弹窗（核心） ========== */
.overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.65);
  display:none;align-items:center;justify-content:center;
  z-index:99;
}
.overlay.show{display:flex;}
.quickplay-modal{
  width:720px;background:#282622;border:3px solid #44413c;border-radius:6px;
  overflow:hidden;
}
.modal-header{
  text-align:center;padding:16px 0;
}
.modal-header h2{
  font-size:36px;color:#f0e9d8;letter-spacing:2px;
}
.modal-body{
  padding:0 24px 20px;
}
.mode-card-wrap{
  position:relative;display:flex;align-items:center;
}
.arrow-btn{
  width:44px;height:140px;background:#5a544b;border:2px solid #443e38;
  color:#ddd;font-size:24px;cursor:pointer;border-radius:4px;
}
.arrow-btn:hover{background:#70695c;}
.mode-card{
  flex:1;margin:0 12px;
  background:#f8f2e0;border:2px solid #b8b09c;border-radius:4px;
  padding:16px;min-height:340px;color:#333;
}
mode‑header-row{
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
}
.mode-index{font-size:24px;color:#666;}
.mode-name{font-size:34px;font-weight:bold;text-transform:uppercase;}
/* Roblox游戏缩略图容器 */
.roblox‑thumb‑box{
  width:100%;height:200px;background:#ddd;
  border-radius:3px;overflow:hidden;margin:10px 0;
  display:flex;align-items:center;justify-content:center;
}
.roblox‑thumb‑box img{width:100%;height:100%;object-fit:cover;}
.loading-text{color:#555;}
.mode‑desc{text-align:center;font-size:15px;color:#444;margin-top:8px;}
.mode‑tip{text-align:center;font-size:14px;color:#b03020;margin-top:6px;}

.modal‑btn‑row{
  display:flex;gap:14px;margin-top:22px;
}
.modal‑btn‑row button{
  flex:1;padding:14px 0;font-size:18px;cursor:pointer;
  background:#d9ceb2;color:#222;border:2px solid #887e68;border-radius:4px;
}
.modal‑btn‑row button:hover{background:#e9dfc8;}
.modal‑bottom‑row{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;
}
.bottom‑left{display:flex;align-items:center;gap:8px;color:#ccc;font-size:15px;}
.cancel‑btn{
  padding:10px 36px;font-size:17px;background:#777167;color:#eee;
  border:2px solid #555048;border-radius:4px;cursor:pointer;
}

/* 底部主菜单栏 */
.bottom‑bar{
  position:absolute;bottom:0;left:0;width:100%;height:70px;
  background:rgba(24,22,20,0.9);border-top:2px solid #504942;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:5;
}
.bottom‑btn{
  background:#60584e;color:#e8e2d5;border:2px solid #443e38;
  padding:10px 18px;font-size:15px;border-radius:4px;cursor:pointer;
}
.bottom‑btn:hover{background:#70675b;}
</style>
</head>
<body>
<div id="root">
  <div class="logo"><h1>TEAM FORTRESS 2</h1></div>
  <div class="left-menu">
    <div class="menu-panel">
      <div class="panel-title">PLAY</div>
      <div class="btn-list">
        <button class="tf2-btn" id="openQuickplay">🌐 开始游玩</button>
        <button class="tf2-btn">🔍 浏览服务器</button>
        <button class="tf2-btn">🎯 训练</button>
      </div>
    </div>
    <div class="menu-panel">
      <div class="panel-title">CUSTOMIZE</div>
      <div class="btn-list">
        <button class="tf2-btn">📦 物品</button>
        <button class="tf2-btn">🔖 商店 <span style="margin-left:auto;background:#b96417;color:#fff;padding:2px 6px;font-size:11px;border-radius:2px">NEW</span></button>
      </div>
    </div>
    <div class="menu-panel">
      <div class="panel-title">CREATE</div>
      <div class="btn-list">
        <button class="tf2-btn">📺 回放</button>
        <button class="tf2-btn">🔧 STEAM WORKSHOP</button>
      </div>
    </div>
  </div>

  <!-- Quickplay弹窗 -->
  <div class="overlay" id="overlay">
    <div class="quickplay-modal">
      <div class="modal-header"><h2>QUICKPLAY</h2></div>
      <div class="modal-body">
        <div class="mode-card-wrap">
          <button class="arrow-btn" id="btnLeft">&lt;</button>
          <div class="mode-card">
            <div class="mode‑header-row">
              <span class="mode-index" id="modeIndex">1/5</span>
              <h3 class="mode-name" id="modeName">大亨</h3>
            </div>
            <!-- Roblox游戏缩略图 -->
            <div class="roblox‑thumb‑box">
              <img id="robloxThumb" alt="Game Preview" style="display:none;">
              <div id="thumbLoading" class="loading-text">加载中...</div>
            </div>
            <div class="mode‑desc" id="modeDesc">随机抽取一款大亨类Roblox游戏</div>
            <div class="mode‑tip" id="modeTip">适合所有水平玩家</div>
          </div>
          <button class="arrow-btn" id="btnRight">&gt;</button>
        </div>
        <div class="modal‑btn‑row">
          <button id="btnPlayNow">PLAY NOW!</button>
          <button id="btnShowServers">SHOW SERVERS</button>
        </div>
        <div class="modal‑bottom‑row">
          <div class="bottom‑left">
            <span>⚙ Server Settings</span>
            <span>(PROVIDED BY MASTERCOMS) ❓</span>
          </div>
          <button class="cancel‑btn" id="btnCancel">CANCEL</button>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom‑bar">
    <button class="bottom‑btn">❄ QUIT</button>
    <div></div>
    <div>
      <button class="bottom‑btn">OPTIONS</button>
      <button class="bottom‑btn">ADV. OPTIONS</button>
    </div>
  </div>
</div>

<script>
// ---------------------- 模式列表（已删除夺旗，名称去掉“模式”） ----------------------
const modeList = [
  {name:"大亨",desc:"随机抽取一款大亨类Roblox游戏",tip:"适合所有水平玩家",universeIds:[14282329,156120794]},
  {name:"非PVP",desc:"随机抽取一款非对抗休闲Roblox游戏",tip:"适合所有水平玩家",universeIds:[189707,28688062]},
  {name:"PVP",desc:"随机抽取一款玩家对抗Roblox游戏",tip:"适合喜欢对战的玩家",universeIds:[15871179,12411474]},
  {name:"跑酷",desc:"随机抽取一款Obby跑酷Roblox游戏",tip:"适合所有水平玩家",universeIds:[52111554,133531180]},
  {name:"随机",desc:"完全随机抽取Roblox游戏",tip:"适合所有水平玩家",universeIds:[14282329,189707,15871179,52111554,28688062]}
];
let currentIndex = 0;

// DOM
const overlay = document.getElementById("overlay");
const openQuickplayBtn = document.getElementById("openQuickplay");
const btnCancel = document.getElementById("btnCancel");
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const modeIndexEl = document.getElementById("modeIndex");
const modeNameEl = document.getElementById("modeName");
const modeDescEl = document.getElementById("modeDesc");
const modeTipEl = document.getElementById("modeTip");
const robloxThumbImg = document.getElementById("robloxThumb");
const thumbLoading = document.getElementById("thumbLoading");

// 打开关闭弹窗
openQuickplayBtn.addEventListener("click",()=>{
  overlay.classList.add("show");
  renderCurrentMode();
});
btnCancel.addEventListener("click",()=>overlay.classList.remove("show"));

// 左右切换
btnLeft.addEventListener("click",()=>{
  currentIndex = (currentIndex -1 + modeList.length) % modeList.length;
  renderCurrentMode();
});
btnRight.addEventListener("click",()=>{
  currentIndex = (currentIndex +1) % modeList.length;
  renderCurrentMode();
});

// 根据universeId调用Roblox缩略图API，适配你给出的返回JSON结构
async function loadRobloxThumb(universeId){
  robloxThumbImg.style.display = "none";
  thumbLoading.style.display = "block";
  thumbLoading.textContent = "加载中...";
  try{
    const resp = await fetch(`https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=${universeId}&countPerUniverse=1&size=768x432&format=Png`);
    const json = await resp.json();
    // 匹配你给的返回结构 data[0].thumbnails[0].imageUrl
    const thumbItem = json.data?.[0]?.thumbnails?.[0];
    if(thumbItem && thumbItem.state === "Completed" && thumbItem.imageUrl){
      robloxThumbImg.src = thumbItem.imageUrl;
      robloxThumbImg.style.display = "block";
      thumbLoading.style.display = "none";
    }else{
      thumbLoading.textContent = "暂无缩略图";
    }
  }catch(err){
    thumbLoading.textContent = "图片加载失败（跨域）";
    console.warn("Roblox缩略图接口错误，本地直接打开会跨域，部署服务器正常",err);
  }
}

// 渲染当前模式
function renderCurrentMode(){
  const m = modeList[currentIndex];
  modeIndexEl.textContent = `${currentIndex+1}/${modeList.length}`;
  modeNameEl.textContent = m.name;
  modeDescEl.textContent = m.desc;
  modeTipEl.textContent = m.tip;
  // 在该模式的universeId列表随机选一个拉取缩略图
  const randId = m.universeIds[Math.floor(Math.random()*m.universeIds.length)];
  loadRobloxThumb(randId);
}

// 立即游玩按钮：随机选一个该分类下的universeId
document.getElementById("btnPlayNow").addEventListener("click",()=>{
  const m = modeList[currentIndex];
  const randId = m.universeIds[Math.floor(Math.random()*m.universeIds.length)];
  alert(`已随机选中 UniverseID:${randId}\n打开：https://www.roblox.com/games?universeId=${randId}`);
});
</script>
</body>
</html>
